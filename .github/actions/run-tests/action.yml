name: "Run Tests"
description: "Lint, build, and run the test suite against the built output"

# Called by halos-org/shared-workflows' pr-checks.yml. A `uses: ./...` inside a
# reusable workflow resolves against the CALLER's checkout, not the workflow's
# own repository -- shared-workflows ships no actions/ directory at all -- so
# every repo that calls pr-checks.yml has to provide this file or the job
# cannot resolve the action.

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

    - name: Install dependencies
      # package-lock.json is gitignored in this repo, so `npm ci` has nothing to
      # read on a clean checkout. Use it when a lockfile is present (reproducible
      # and faster) and fall back otherwise.
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
      shell: bash

    - name: Lint and format check
      run: npm run ci-lint
      shell: bash

    - name: Fetch the bundled DuckDB extensions
      # The roll suite spawns the real roll process, which loads
      # sqlite_scanner from extensions/ — so without this the roll's tests
      # skip themselves and the unit's core behaviour goes unverified here.
      # tsc directly rather than `npm run build`, whose bundled-extension gate
      # refuses the very state this step repairs.
      #
      # Whether the binary loads OFFLINE on the device's architecture is a
      # different question, and duckdb-extension.yml is what answers it.
      run: |
        npx tsc
        node tools/fetch-extensions.mjs
      shell: bash

    - name: Build and test
      # build:all is build -> test. The suites execute the compiled output in
      # dist/, so building is not an extra step here, it is what makes the
      # tests runnable at all.
      run: npm run build:all
      shell: bash
