name: Main Branch CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-main-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    uses: halos-org/shared-workflows/.github/workflows/build-release.yml@main
    with:
      package-name: signalk-duckdb-history-provider
      package-description: "History provider for Signal K: a SQLite hot store rolled into a Parquet tree, queried with DuckDB"
      build-deb: false
