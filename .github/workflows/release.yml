# The npm package's trusted publisher must name this file, release.yml.
# publish-npm.yml serializes publishes itself; do not add a concurrency group
# named <repository>-publish-npm-job here.
#
# prepublishOnly builds, fetches the DuckDB extension binaries and re-checks
# the set. publish-npm.yml runs it before npm pack, so the tarball carries the
# binaries and the publish step can stay on --ignore-scripts.
name: Publish stable release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-npm:
    permissions:
      contents: read
      id-token: write
    uses: halos-org/shared-workflows/.github/workflows/publish-npm.yml@v1.0.0-rc.1
