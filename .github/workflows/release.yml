name: Publish Stable Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.repository }}-npm-publish
  cancel-in-progress: false

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    # Only publish stable releases, not pre-releases
    if: ${{ github.event.release.prerelease == false }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # None of these jobs runs an authenticated git operation, and each
          # one then packs this workspace or mounts it into a container. The
          # default leaves the job token in .git/config for every later step.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install pinned npm with trusted publishing support
        # Pin via corepack rather than `npm install -g npm@latest` so a broken
        # bundled npm in the Node toolcache cannot fail the install step.
        run: |
          corepack enable
          corepack prepare npm@11.14.1 --activate
          npm --version

      - name: Check if version exists on npm
        id: check
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          PKG_VERSION=$(node -p "require('./package.json').version")
          # npm publish ships package.json's version while everything here reads
          # VERSION. Drift would check one number and publish another, so stop
          # rather than guess which was meant. check-versions catches this on a
          # PR; this covers a push that never went through one.
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::VERSION ($VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          # The scoped name, read from package.json rather than written out:
          # publishing checks one name and this check must not read another.
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$VERSION" version 2>/dev/null; then
            # A +N-only merge (no VERSION change) cuts a new GitHub release that
            # publishes nothing here. Surface it loudly so a "published" release
            # that ships nothing to npm is not mistaken for a real release --
            # bump VERSION to publish a new version.
            echo "::warning::$PKG_NAME@$VERSION is already on npm; nothing to publish. Bump VERSION to release a new version."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not found on npm, will publish"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to npm
        if: steps.check.outputs.exists == 'false'
        # npm publish runs prepublishOnly, which builds, downloads the DuckDB
        # extension binaries for the published platform set, and then re-checks
        # that the set is complete. Do not add --ignore-scripts here: the
        # tarball would ship unbuilt and without the extensions, and a device
        # with no network could not read its own hot store.
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          npm publish
