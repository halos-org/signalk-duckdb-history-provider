# Boots a real Signal K server and checks that it discovers and loads this
# package as a plugin. Nothing else covers that: the unit suites run compiled
# modules in isolation, and package-e2e asserts the tarball's shape -- not
# that signalk-server finds the package, reads its schema and starts it.
#
# It asserts the history surfaces answer, because that is the only place the
# whole chain is exercised at once: sample NMEA into the recorder, through the
# socket to the writer, into SQLite, out through the query service's DuckDB and
# back as JSON. Both API versions are checked -- the v2 REST endpoints, and the
# v1 snapshot, which additionally goes through the server's own tree builder.
# v1 playback is a WebSocket and is covered by the unit suite instead.

name: Signal K Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: signalk-server ${{ matrix.signalk-server-version }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        signalk-server-version: ["latest"]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          # None of these jobs runs an authenticated git operation, and each
          # one then packs this workspace or mounts it into a container. The
          # default leaves the job token in .git/config for every later step.
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Build and pack the plugin
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          # extensions/ is gitignored and downloaded, so a checkout has none.
          # `prepublishOnly` fetches them for a real publish, but npm does not
          # run that hook for `npm pack` -- so without this the tarball ships
          # no sqlite_scanner and every hot-store query below answers 400.
          npm run fetch-extensions
          echo "PLUGIN_TGZ=$(npm pack --ignore-scripts --pack-destination /tmp)" >> "$GITHUB_ENV"

      - name: Install signalk-server and the plugin
        run: |
          mkdir -p /tmp/sk-test && cd /tmp/sk-test
          npm init -y > /dev/null
          npm install signalk-server@${{ matrix.signalk-server-version }}
          # basename defensively: some npm versions emit a path-prefixed name.
          npm install "/tmp/$(basename "$PLUGIN_TGZ")"

      - name: Enable the plugin
        run: |
          cd /tmp/sk-test
          mkdir -p plugin-config-data
          # Two names, and they are deliberately different: the package is
          # scoped and the plugin id is not, because the id becomes a config
          # filename and a scoped name would put a slash in it. So both are
          # read rather than assumed -- resolving by package name also means a
          # rename cannot leave a stale node_modules path here.
          PKG_NAME=$(node -p "require('$GITHUB_WORKSPACE/package.json').name")
          PLUGIN_ID=$(node -p "require('$PKG_NAME/dist/plugin-id.js').PLUGIN_ID")
          echo "PLUGIN_ID=$PLUGIN_ID" >> "$GITHUB_ENV"
          cat > "plugin-config-data/${PLUGIN_ID}.json" <<JSON
          { "enabled": true, "configuration": {} }
          JSON

      - name: Start the server and verify the plugin
        env:
          # How the server finds plugin-config-data/. Without it the config
          # written above is never read and the plugin stays disabled, which
          # would fail this job for the wrong reason.
          SIGNALK_NODE_CONFIG_DIR: /tmp/sk-test
        run: |
          cd /tmp/sk-test
          npx signalk-server --sample-nmea0183-data -p 3000 > /tmp/sk.log 2>&1 &
          echo $! > /tmp/sk.pid

          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/signalk/v1/api/ > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://localhost:3000/signalk/v1/api/ > /dev/null || {
            echo "::error::signalk-server did not start"; cat /tmp/sk.log; exit 1; }

          echo "--- loaded plugins ---"
          PLUGINS=$(curl -sf http://localhost:3000/skServer/plugins)
          echo "$PLUGINS" | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8")).forEach(p=>console.log(p.id))'
          echo "$PLUGINS" | grep -q "$PLUGIN_ID" || {
            echo "::error::the server did not load the plugin"; cat /tmp/sk.log; exit 1; }

          # The configuration form the operator sees IS plugin.schema(). An
          # empty schema loads without error and leaves every option unsettable.
          echo "--- config schema ---"
          echo "$PLUGINS" | node -e '
            const plugins = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const plugin = plugins.find((p) => p.id === process.env.PLUGIN_ID);
            const properties = Object.keys(plugin.schema?.properties ?? {});
            console.log(properties.join(", "));
            const required = ["pathFilter", "defaultSamplingRate", "dataDir", "rollIntervalMinutes", "retentionDays"];
            const missing = required.filter((name) => !properties.includes(name));
            if (missing.length > 0) {
              console.error(`::error::the config form is missing ${missing.join(", ")}`);
              process.exit(1);
            }
          '

          # Discovery is not startup. signalk-server lists installed plugins
          # whether or not they are enabled, and start() reports every failure
          # through setPluginError and returns normally -- so a plugin that
          # failed to start looks identical above. That matters most for the
          # library check below: if no plugin code ran, nothing could have been
          # mapped, and the job would pass for the wrong reason.
          #
          # The directories are the assertion rather than the status line:
          # setPluginStatus does not populate statusMessage on this endpoint
          # (verified against a real server -- it stays empty for a plugin that
          # started correctly), and a created directory is positive evidence
          # that start() ran to completion. It also pins the on-disk layout
          # that the writer unit will assume.
          echo "--- storage layout the plugin created ---"
          DATA_DIR="/tmp/sk-test/plugin-config-data/$PLUGIN_ID"
          for sub in hot parquet duckdb-extensions; do
            [ -d "$DATA_DIR/$sub" ] || {
              echo "::error::the plugin did not create $DATA_DIR/$sub, so start() did not complete"
              cat /tmp/sk.log; exit 1; }
            echo "  $DATA_DIR/$sub"
          done

          # The whole chain, and the only check that covers it end to end: the
          # sample stream reached the recorder, the socket, SQLite, the query
          # service's DuckDB and came back as JSON. A server with no provider
          # registered answers 501 here, which is what this build did before
          # the v2 surface existed.
          echo "--- history v2 surface ---"
          HISTORY="http://localhost:3000/signalk/v2/api/history"
          # A path the sample stream always carries -- plaka.log holds 7250
          # $IIDBT sentences -- so the answers below are built by this plugin's
          # own assembly rather than by an empty short circuit.
          ASKED=environment.depth.belowTransducer

          # `to` is recomputed on every attempt below, so it never falls behind
          # while the loop waits.
          window() {
            FROM=$(node -e 'console.log(new Date(Date.now() - 3600000).toISOString())')
            TO=$(node -e 'console.log(new Date().toISOString())')
          }
          nonEmpty() {
            WHAT="$1" node -e '
              const body = JSON.parse(require("fs").readFileSync(0, "utf8"));
              if (Array.isArray(body) && body.length > 0) process.exit(0);
              console.error(`::error::history/${process.env.WHAT} answered ${JSON.stringify(body)}`);
              process.exit(1);
            '
          }

          # A recorded sample reaches the store a flush interval after the
          # server starts answering, and the loop above stops waiting at the
          # first answer -- seconds earlier. The assertions below require a
          # non-empty body, so they need the store to hold something first.
          echo "waiting for $ASKED to reach the store"
          for _ in $(seq 1 60); do
            window
            if curl -sf -o /tmp/paths.json "$HISTORY/paths?from=$FROM&to=$TO" &&
               grep -q "\"$ASKED\"" /tmp/paths.json; then
              break
            fi
            sleep 2
          done

          CODE=$(curl -s -o /tmp/contexts.json -w '%{http_code}' "$HISTORY/contexts?from=$FROM&to=$TO")
          [ "$CODE" = "200" ] || {
            echo "::error::history/contexts answered $CODE: $(cat /tmp/contexts.json)"
            cat /tmp/sk.log; exit 1; }
          nonEmpty contexts < /tmp/contexts.json || { cat /tmp/sk.log; exit 1; }
          echo "  contexts: $(cat /tmp/contexts.json)"

          CODE=$(curl -s -o /tmp/paths.json -w '%{http_code}' "$HISTORY/paths?from=$FROM&to=$TO")
          [ "$CODE" = "200" ] || {
            echo "::error::history/paths answered $CODE: $(cat /tmp/paths.json)"
            cat /tmp/sk.log; exit 1; }
          nonEmpty paths < /tmp/paths.json || { cat /tmp/sk.log; exit 1; }
          echo "  paths: $(head -c 300 /tmp/paths.json)"

          CODE=$(curl -s -o /tmp/values.json -w '%{http_code}' \
            "$HISTORY/values?from=$FROM&to=$TO&resolution=10&paths=$ASKED")
          [ "$CODE" = "200" ] || {
            echo "::error::history/values answered $CODE: $(cat /tmp/values.json)"
            cat /tmp/sk.log; exit 1; }
          ASKED="$ASKED" node -e '
            const answer = JSON.parse(require("fs").readFileSync("/tmp/values.json", "utf8"));
            const series = answer.values?.[0];
            if (series?.path !== process.env.ASKED) {
              console.error(`::error::the response describes ${JSON.stringify(answer.values)}, not ${process.env.ASKED}`);
              process.exit(1);
            }
            // The rows are the point. A provider that echoes the requested
            // series and queries nothing answers 200 with an empty `data`.
            if (!Array.isArray(answer.data) || answer.data.length === 0) {
              console.error("::error::history/values returned no rows");
              process.exit(1);
            }
            console.log(`  values: ${answer.data.length} rows for ${series.path} as ${series.method}`);
          ' || { cat /tmp/sk.log; exit 1; }

          # The v1 snapshot route, which is the half of that surface a shell can
          # reach -- playback is a WebSocket and is covered by the unit suite.
          # It is worth its own check because it is the one request that goes
          # through the server's own tree builder: the route maps `self` in the
          # URL to the vessel's id before walking what it built, so a provider
          # returning the context the store spells answers 200 here with
          # nothing, or throws inside the builder.
          echo "--- history v1 snapshot ---"
          AT=$(node -e 'console.log(new Date().toISOString())')
          SNAPSHOT="http://localhost:3000/signalk/v1/snapshot"
          LEAF=$(echo "$ASKED" | tr '.' '/')
          CODE=$(curl -s -o /tmp/snapshot.json -w '%{http_code}' \
            "$SNAPSHOT/vessels/self/$LEAF?time=$AT")
          [ "$CODE" = "200" ] || {
            echo "::error::the v1 snapshot answered $CODE: $(cat /tmp/snapshot.json)"
            cat /tmp/sk.log; exit 1; }
          node -e '
            const leaf = JSON.parse(require("fs").readFileSync("/tmp/snapshot.json", "utf8"));
            if (typeof leaf?.value !== "number") {
              console.error(`::error::the v1 snapshot returned ${JSON.stringify(leaf)}`);
              process.exit(1);
            }
            console.log(`  snapshot: ${leaf.value} at ${leaf.timestamp}`);
          ' || { cat /tmp/sk.log; exit 1; }

          # The premise of the design: the server pays for no storage engine.
          # Checked after a query has run, which is the moment an engine would
          # have been mapped if anything about the query path were in-process.
          # /tmp/sk.pid is npx's, not the server's, so the process is found by
          # name -- and not finding it fails, because a check that cannot
          # locate its target must not report success.
          echo "--- native libraries in the server process ---"
          SERVER_PIDS=$(pgrep -f "signalk-server" || true)
          [ -n "$SERVER_PIDS" ] || {
            echo "::error::could not find the signalk-server process to inspect"; exit 1; }
          for pid in $SERVER_PIDS; do
            if grep -qi duckdb "/proc/$pid/maps" 2>/dev/null; then
              echo "::error::the Signal K process (pid $pid) mapped a DuckDB library"
              exit 1
            fi
          done
          echo "no DuckDB library mapped in: $(echo "$SERVER_PIDS" | tr '\n' ' ')"

      - name: Stop the server
        if: always()
        run: kill "$(cat /tmp/sk.pid)" 2>/dev/null || true

      - name: Server log
        if: failure()
        run: tail -200 /tmp/sk.log || true

  # A stable name for branch protection to require. The matrix job names carry
  # their matrix values ("signalk-server latest / Node 22"), so requiring those
  # directly means every matrix edit silently blocks every PR on a context that
  # will never report again.
  integration-status:
    name: Integration status
    if: always()
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check the matrix result
        run: |
          echo "integration: ${{ needs.integration.result }}"
          # skipped and cancelled are not success. Only success passes.
          [ "${{ needs.integration.result }}" = "success" ] || {
            echo "::error::the Signal K integration matrix did not succeed"; exit 1; }
